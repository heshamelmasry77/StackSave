name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stacksave
          POSTGRES_PASSWORD: stacksave
          POSTGRES_DB: stacksave
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U stacksave"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run check
